<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Twitch Sub Dashboard" }}</title>
    <style>
        body {
            margin: 0;
            background-color: #0e0e10;
            color: #efeff1;
            font-family: 'Inter', sans-serif;
        }
        a { color: #9146FF; text-decoration: none; }
        h1, h2, h3 { color: #fff; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}
        <!-- Contenido del dashboard -->
        {% endblock %}
    </div>
</body>
</html>
