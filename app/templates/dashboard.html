<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>{{ streamer.display_name }} — Dashboard</title>
<style>
body {
  background: #0e0e10;
  color: #eee;
  font-family: system-ui, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 24px;
}
h1 {
  color: #cfaaff;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 24px;
  font-size: 14px;
}
th, td {
  padding: 8px;
  border-bottom: 1px solid #2a2a2a;
}
th {
  background: #6441a5;
  color: #fff;
  text-align: left;
}
button {
  background: #6441a5;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
button:hover {
  background: #7a5ed8;
}
.detail-row {
  display: none;
  background: #1b1b1b;
}
.detail-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}
.detail-table td {
  padding: 6px 8px;
  border-bottom: 1px solid #2a2a2a;
}
.sub-ok { color: #66ff99; }
.expulsado { color: #ff6666; }
.fallo { color: #ffaa33; }
.icon { font-weight: bold; margin-right: 6px; }
.timestamp { color: #666; font-size: 12px; }
.username { font-weight: bold; }
.twitch { color: #aaa; margin-left: 6px; }
</style>
<script>
async function toggleDetails(id){
  const row = document.getElementById("details-"+id);
  if(row.style.display === "table-row"){ row.style.display="none"; return; }
  row.style.display="table-row";

  const resp = await fetch(`/dashboard/details/${id}`);
  const data = await resp.json();

  const html = data.map(d => {
    const clase = d.accion === "expulsado" ? "expulsado" : "fallo";
    const icon = d.accion === "expulsado" ? "❌" : "⚠️";
    const motivo = d.motivo ? ` — <i>${d.motivo}</i>` : "";
    const tw = d.twitch_login && d.twitch_login !== "—" ? `<span class='twitch'>(${d.twitch_login})</span>` : "";
    const fecha = d.timestamp ? `<div class='timestamp'>${new Date(d.timestamp).toLocaleString()}</div>` : "";
    return `<tr><td class='${clase}'><span class='icon'>${icon}</span><span class='username'>${d.username}</span>${tw}${motivo}${fecha}</td></tr>`;
  }).join("");

  row.querySelector("tbody").innerHTML = html || "<tr><td>Sin usuarios expulsados o con fallos</td></tr>";
}
</script>
</head>
<body>
<h1>📊 Dashboard — {{ streamer.display_name }}</h1>

<table>
  <tr>
    <th>Fecha</th>
    <th>Miembros</th>
    <th>Expulsados</th>
    <th>Fallos</th>
    <th>Acción</th>
  </tr>
  {% for a in auditorias %}
  <tr>
    <td>{{ a.fecha_auditoria.strftime("%d/%m/%Y %H:%M") }}</td>
    <td>{{ a.total_miembros }}</td>
    <td>{{ a.expulsados }}</td>
    <td>{{ a.fallos }}</td>
    <td><button onclick="toggleDetails('{{ a.id }}')">Ver detalles</button></td>
  </tr>
  <tr id="details-{{ a.id }}" class="detail-row">
    <td colspan="5">
      <table class="detail-table"><tbody></tbody></table>
    </td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
