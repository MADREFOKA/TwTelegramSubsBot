<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - {{ slug }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0e0e10;
      color: #efeff1;
      font-family: 'Inter', sans-serif;
    }
    .navbar {
      background-color: #9146FF;
      border-bottom: 3px solid #772ce8;
    }
    .navbar-brand {
      color: white !important;
      font-weight: 600;
      font-size: 1.3rem;
    }
    .chart-container {
      background: #18181b;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .table {
      color: #efeff1;
      border-color: #2c2c2e;
    }
    .table th {
      color: #a970ff;
    }
    .footer {
      text-align: center;
      color: #777;
      margin-top: 40px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark mb-5">
    <div class="container">
      <span class="navbar-brand">Twitch Subs Dashboard — {{ slug }}</span>
    </div>
  </nav>

  <div class="container">
    <div class="chart-container mb-4">
      <h4 class="mb-4 text-center">📈 Actividad de Auditorías</h4>
      <canvas id="auditChart" height="120"></canvas>
    </div>

    <div class="table-responsive">
      <h5 class="mb-3">📋 Registros recientes</h5>
      <table class="table table-dark table-striped align-middle">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Suscriptores Activos</th>
            <th>Eliminados</th>
          </tr>
        </thead>
        <tbody>
          {% for i in range(labels|length) %}
            <tr>
              <td>{{ labels[i] }}</td>
              <td>{{ kept[i] }}</td>
              <td class="text-danger">{{ removed[i] }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <p>Bot de Twitch © 2025 — Dashboard seguro para streamers</p>
  </div>

  <script>
    const labels = {{ labels|tojson }};
    const removed = {{ removed|tojson }};
    const kept = {{ kept|tojson }};

    const ctx = document.getElementById('auditChart');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.reverse(),
        datasets: [
          {
            label: 'Activos',
            data: kept.reverse(),
            borderColor: '#00FF9D',
            backgroundColor: 'rgba(0,255,157,0.1)',
            tension: 0.3,
            fill: true
          },
          {
            label: 'Eliminados',
            data: removed.reverse(),
            borderColor: '#f05050',
            backgroundColor: 'rgba(240,80,80,0.1)',
            tension: 0.3,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: 'white' } },
          title: { display: false }
        },
        scales: {
          x: { ticks: { color: '#ccc' }, grid: { color: '#2c2c2e' } },
          y: { ticks: { color: '#ccc' }, grid: { color: '#2c2c2e' } }
        }
      }
    });
  </script>
</body>
</html>
